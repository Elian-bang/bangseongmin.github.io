<svg xmlns="http://www.w3.org/2000/svg" width="640" height="468" viewBox="0 0 640 468" role="img" aria-labelledby="title desc">
  <title id="title">알림 발송 구조와 가상 스레드 실험 경로</title>
  <desc id="desc">운영의 분리 전과 후, 그리고 실험에서 비교한 JDBC 포함 요청과 대기 전용 요청을 보여준다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#52657b"/>
    </marker>
  </defs>
  <rect width="640" height="468" rx="16" fill="#f8fafc"/>
  <g fill="#182c40" font-family="system-ui, sans-serif">
    <text x="24" y="40" font-size="24" font-weight="700">운영 알림 발송</text>
    <text x="24" y="88" font-size="17" font-weight="600">분리 전</text>
    <text x="24" y="153" font-size="17" font-weight="600">분리 후</text>
    <g fill="#e9f1fb" stroke="#94afcc">
      <rect x="100" y="60" width="234" height="44" rx="8"/>
      <rect x="100" y="125" width="112" height="44" rx="8"/>
      <rect x="232" y="125" width="111" height="44" rx="8"/>
      <rect x="363" y="125" width="112" height="44" rx="8"/>
      <rect x="495" y="125" width="121" height="44" rx="8"/>
      <rect x="495" y="60" width="121" height="44" rx="8"/>
    </g>
    <g font-size="16" text-anchor="middle">
      <text x="217" y="88">메인 서버에서 발송</text>
      <text x="555" y="88">외부 채널 API</text>
      <text x="156" y="153">메인 서버</text>
      <text x="287" y="153">RabbitMQ</text>
      <text x="419" y="153">발송 서버</text>
      <text x="555" y="153">외부 채널 API</text>
      <text x="491" y="194" fill="#415972">가상 스레드로 동시 호출</text>
    </g>
    <path d="M419 169v10h22" stroke="#94afcc" fill="none"/>
    <path d="M24 218H616" stroke="#c4d1dd"/>
    <text x="24" y="253" font-size="24" font-weight="700">실험 앱의 요청 경로</text>
    <text x="24" y="282" font-size="17" fill="#415972">1 vCPU · 1 GiB / 플랫폼 스레드와 가상 스레드 비교</text>
    <text x="24" y="337" font-size="17" font-weight="600">/send</text>
    <text x="24" y="404" font-size="17" font-weight="600">/sleep</text>
    <g fill="#e9f1fb" stroke="#94afcc">
      <rect x="100" y="309" width="144" height="44" rx="8"/>
      <rect x="260" y="309" width="170" height="44" rx="8" fill="#fef3dc" stroke="#d5b576"/>
      <rect x="446" y="309" width="170" height="44" rx="8"/>
      <rect x="260" y="376" width="170" height="44" rx="8" fill="#fef3dc" stroke="#d5b576"/>
    </g>
    <g font-size="17" text-anchor="middle">
      <text x="172" y="337">JDBC 대상 조회</text>
      <text x="345" y="337">50ms 대기</text>
      <text x="531" y="337">JDBC 결과 갱신</text>
      <text x="345" y="404">50ms 대기</text>
    </g>
    <text x="24" y="446" font-size="16" fill="#415972">50ms 대기는 외부 채널 API 응답을 대신한다.</text>
  </g>
  <g stroke="#52657b" fill="none" marker-end="url(#arrow)">
    <path d="M334 82H487"/>
    <path d="M212 147H226"/>
    <path d="M343 147H357"/>
    <path d="M475 147H489"/>
    <path d="M244 331H255"/>
    <path d="M430 331H441"/>
  </g>
